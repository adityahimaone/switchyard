<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/switchyard-favicon-blue-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/brand/switchyard-favicon-blue-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/switchyard-favicon-blue-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2f4fd" />
    <title>Switchyard</title>
    <script>
      // Applies the stored theme before first paint, so there is no flash of the
      // wrong surface. Light is the default in Signal Blue, so `dark` is the
      // class that gets added. Must stay in sync with applyTheme() in
      // src/hooks/useSettings.ts, which re-applies it on boot.
      //
      // The effects budget is applied here too, for the same reason: a user on
      // "lite" would otherwise get a frame or two of 20px blur and drifting
      // orbs before React mounted and pulled it back to 8px — which on a slow
      // GPU is exactly the stutter they turned the setting off to avoid.
      (() => {
        try {
          const preference = localStorage.getItem("kb-theme") || "system"
          const dark =
            preference === "dark" ||
            (preference === "system" && !matchMedia("(prefers-color-scheme: light)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.dataset.theme = preference

          const effects = localStorage.getItem("kb-effects") === "lite" ? "lite" : "system"
          document.documentElement.dataset.effects = effects

          // The palette is applied here for the same reason, and it matters more
          // than it looks: `themes.css` overrides the whole colour layer through
          // `:root[data-theme-palette="…"]`, so without the attribute before first
          // paint a user on Lime forest or Zen linen gets a frame or two of Signal
          // Blue. Removing it for the default is what keeps Signal winning on
          // specificity — an attribute left behind would outrank the base
          // stylesheet and silently override it.
          const palette = localStorage.getItem("kb-palette")
          if (palette && palette !== "signal")
            document.documentElement.dataset.themePalette = palette
          else
            delete document.documentElement.dataset.themePalette
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
