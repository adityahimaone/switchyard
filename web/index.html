<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/switchyard-favicon-blue-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/brand/switchyard-favicon-blue-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/switchyard-favicon-blue-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2f4fd" />
    <title>Switchyard</title>
    <script>
      // Applies the stored theme before first paint, so there is no flash of the
      // wrong surface. Light is the default in Signal Blue, so `dark` is the
      // class that gets added. Must stay in sync with applyTheme() and
      // applyPalette() in src/hooks/useSettings.ts, which re-apply them on boot.
      //
      // The palette has to be set here too, and for the same reason: a reload
      // would otherwise paint one full frame of Signal Blue before React
      // mounted and switched to the stored palette.
      (() => {
        try {
          const preference = localStorage.getItem("kb-theme") || "system"
          const dark =
            preference === "dark" ||
            (preference === "system" && !matchMedia("(prefers-color-scheme: light)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.dataset.theme = preference
          // "signal" is the base stylesheet and is expressed as *no* attribute,
          // so a user who returns to the default has it removed.
          const palette = localStorage.getItem("kb-palette")
          if (palette && palette !== "signal")
            document.documentElement.dataset.themePalette = palette
          else
            delete document.documentElement.dataset.themePalette
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
