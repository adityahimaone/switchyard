name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a busy branch does not queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (vet, race, lint, vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Track the latest 1.26 patch rather than the exact `go 1.26.0` in go.mod.
      # govulncheck reports standard-library CVEs that are fixed in patch
      # releases (GO-2026-5972 in encoding/asn1, GO-2026-5026 in net/http, both
      # fixed in 1.26.6); pinning 1.26.0 makes the security step fail on the
      # toolchain rather than on this code.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race is the reason this job is slow and the reason it is worth running:
      # the dispatchers and the SQLite-backed stores are concurrent.
      - name: Test (race)
        run: go test -race ./...

      # Pinned, not "latest": golangci-lint refuses to run when the Go it was
      # built with is older than the module's target, so an unpinned action
      # broke CI with "go1.24 ... lower than the targeted Go version (1.26.0)"
      # without a single line of Go changing. v2.15.0 is built with Go 1.26.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    name: Web (typecheck, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # The version is required: the action reads `packageManager` from the
      # repo-root package.json, and this repo keeps its only package.json under
      # web/. Without it the job fails in 7 seconds with
      # "No pnpm version is specified". Keep this in step with
      # web/package.json → packageManager.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # `build` runs `tsc -b` first, so a type error fails here rather than
      # producing a bundle that fails at runtime.
      - name: Typecheck and build
        run: pnpm build

      - name: Test
        run: pnpm test

      # tsc and vitest are blind to design-token drift: neither resolves a CSS
      # custom property nor compares a colour against a ratio. The gate is part
      # of verify:fast locally; running it here is what stops it rotting.
      - name: Design-token lint
        run: node ../scripts/token-lint.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the audit found a compiled binary and a patch file
          # carrying a real hostname, so the working tree is not the only place
          # a secret can hide.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A private fork without the free org plan cannot read this by
          # default; scanning the fetched history keeps the job useful anyway.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
